<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Web KMP</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0f0f;
        }

        #ComposeApp {
            width: 100%;
            height: 100%;
            outline: none;
        }
    </style>
</head>
<body>
    <canvas id="ComposeApp"></canvas>
    <div id="video-container" style="display:none; position:absolute; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index: 1000; align-items:center; justify-content:center; flex-direction:column;">
        <div id="video-wrapper" style="width:90%; max-width:960px; aspect-ratio:16/9; position:relative; background:#000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border-radius: 8px; overflow: hidden;"></div>
        <button onclick="document.getElementById('video-container').style.display='none'; document.getElementById('video-wrapper').innerHTML='';" style="margin-top:20px; padding:10px 24px; background:#e50914; color:#fff; border:none; border-radius:4px; font-weight:bold; cursor:pointer; font-size:14px; font-family:sans-serif; transition: background 0.2s;">Đóng Trình Phát</button>
    </div>
    <script src="composeApp.js"></script>
</body>
</html>
